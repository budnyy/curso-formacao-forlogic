<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            border: 3px solid blue;
            display: grid;
            grid-template: repeat(3, 100px) / repeat(4, 1fr) 1.5fr;
            gap: 10px;

            grid-auto-flow: row;
            grid-auto-rows: 100px;
            grid-auto-columns: 1fr;
        }

        .item{
            text-align: center;
            background-color: lightblue;
            border: 1px dotted black;
        }

        .d2{
            grid-row: 1 / -1;
            grid-column: 2 / 3;
        }

        .d5{
            grid-row: 1 / -1;
            grid-column: -1 / -2;
        }

        .d8{
            grid-row: 2/4;
            grid-column: 3/5;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">1</div>
        <div class="item d2">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item d5">5</div>
        <div class="item">6</div>
        <div class="item">7</div>
        <div class="item d8">8</div>
    </div>
</body>
</html>
