<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Dashboard - att 01</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
        }

        .layout{
            height: 100vh;
            display: grid;
            grid-template: 70px calc(100vh - 70px) / 200px calc(100vw - 200px);
        }

        .sidebar{
            background-color: lightgray;

            grid-row: 1/3;
            grid-column: 1/2;
        }

        .navbar{
            background-color: lightblue;
        }        

        .main{
            background-color: lightgoldenrodyellow;

            display:grid;
            grid-template: 1fr 0.3fr repeat(3, 2fr) / repeat(5, 1fr);
        }

        .main div{
            background-color: lightseagreen;
            margin:10px;
            border: 1px solid black;
        }

        .month{
            grid-row: 1/3;
            grid-column: -1/-2;
        }

        .spending{
            grid-row:2/4;
            grid-column: 1/5;
        }

        .budget{
            grid-row: 3/5;
            grid-column: -1/-2;
        }

        .recent{
            grid-row: -1/-3;
            grid-column: 1/-2;
        }
    </style>
</head>
<body>
    <div class="layout">
        <div class="navbar">navbar</div>
        <div class="sidebar">sidebar</div>
        <div class="main">
            <div class="bignumber">48291</div>
            <div class="bignumber">7200</div>
            <div class="bignumber">4120</div>
            <div class="bignumber">3079</div>
            <div class="month">this month</div>
            <div class="spending">spending graph</div>
            <div class="budget">budget progress</div>
            <div class="recent">recent transactions</div>
        </div>
    </div>

    <!-- essa foi a primeira tentativa -->
    <!-- oque falta para controlar o tamanho das divs é a função minmax e os media queries, que devo aprender amanha -->
    <!-- clonar essa pasta ao invés de alterar diretamente o código dela -->

    <!-- chatgpt também falou de usar grid-template-areas ao invés de controlar apenas com grid-row e grid-column, talvez seja interessante pesquisar sobre depois -->
</body>
</html>
