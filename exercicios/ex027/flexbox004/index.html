<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>

        div.container{
            background-color: lightsalmon;
            display: flex;

            flex-flow: row nowrap;

            justify-content: center;
            align-items: center;

            height: 100vh;
            width: 100vw;
        }

        div.item{
            background-color: lightblue;
            border: 1px solid black;
            padding: 10px;
            margin: 5px;

            height: 50px;
            width: 50px;

            text-align: center;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="item">A</div>
    </div>
</body>
</html>
