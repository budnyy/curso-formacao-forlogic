<head>

    <title>Flexible Box</title>

        div.container{
            background-color: lightsalmon;
            display: flex;
        }

        div.item{

            border: 1px solid black;
            
            text-align: center;
            flex: auto;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="item">A</div>
